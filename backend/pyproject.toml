[project]
name = "aurora-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "apscheduler>=3.10,<4",
  "httpx>=0.27",
  "feedparser>=6.0",
  "trafilatura>=1.8",
  "beautifulsoup4>=4.12",
  "pydantic-settings>=2.4",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
